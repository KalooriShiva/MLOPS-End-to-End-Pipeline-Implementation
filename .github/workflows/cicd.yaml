name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Run MLOps Pipeline
  mlops-pipeline:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run MLOps Pipeline
      env:
        MONGODB_URL: ${{ secrets.MONGODB_URL }}
      run: |
        python demo.py
    
    - name: Upload pipeline artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: mlops-artifacts
        path: |
          artifacts/
          logs/
        retention-days: 30

  # Job 2: Build and Push Docker Image
  docker-build:
    runs-on: ubuntu-latest
    needs: mlops-pipeline  # Wait for MLOps pipeline to complete
    if: github.ref == 'refs/heads/main'  # Only run on main branch
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vehicle-insurance-prediction:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/vehicle-insurance-prediction:latest